name: terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: fmt / validate / test / tflint / checkov / shellcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform test (mocked provider, no AWS credentials)
        run: terraform test

      - name: advanced profile - init / validate / test
        working-directory: terraform/advanced
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          tflint --chdir=terraform --config="$PWD/.tflint.hcl" --recursive

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          compact: true

      - name: shellcheck
        working-directory: .
        run: shellcheck scripts/*.sh terraform/modules/compute/templates/bastion.sh
