<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="title desc">
  <title id="title">SecureVPC architecture</title>
  <desc id="desc">Admin SSH enters through an Internet Gateway to a bastion host in a public subnet; the bastion reaches a web server in a private subnet; the web server egresses through a NAT Gateway; VPC Flow Logs deliver to CloudWatch Logs and optionally S3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <style>
      .t  { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; fill: #111; }
      .m  { font-family: Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; fill: #111; }
      .mg { font-family: Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; fill: #555; }
      .h1 { font-size: 26px; font-weight: 700; }
      .h2 { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
      .h3 { font-size: 15px; font-weight: 700; }
      .s  { font-size: 12.5px; }
      .xs { font-size: 11px; }
      .box   { fill: #fff; stroke: #111; stroke-width: 2; }
      .frame { fill: none; stroke: #111; stroke-width: 1.5; }
      .tier  { fill: #f4f4f4; stroke: #111; stroke-width: 1.5; }
      .tierp { fill: #e8e8e8; stroke: #111; stroke-width: 1.5; }
      .dash  { fill: #fff; stroke: #111; stroke-width: 2; stroke-dasharray: 6 4; }
      .in    { stroke: #111; stroke-width: 2.5; fill: none; }
      .out   { stroke: #111; stroke-width: 2.5; fill: none; stroke-dasharray: 9 6; }
      .log   { stroke: #666; stroke-width: 2; fill: none; stroke-dasharray: 2 5; stroke-linecap: round; }
      .badge { fill: #111; }
      .bt    { font-family: Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 10.5px; fill: #fff; font-weight: 700; }
      .num   { fill: #111; }
      .numt  { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; font-size: 12px; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#fff"/>

  <!-- Title -->
  <text class="t h1" x="40" y="46">SecureVPC</text>
  <text class="mg s" x="218" y="45">segmented AWS VPC · bastion access model · Terraform reconstruction</text>

  <!-- Internet row -->
  <rect class="box" x="90" y="72" width="270" height="62" rx="4"/>
  <text class="t h3" x="108" y="98">Admin workstation</text>
  <text class="m xs" x="108" y="120">source IP in admin_cidrs (/32)</text>

  <rect class="box" x="560" y="72" width="290" height="62" rx="4"/>
  <text class="t h3" x="578" y="98">Internet</text>
  <text class="m xs" x="578" y="120">OS package repos · 80/443 only</text>

  <!-- Region + VPC -->
  <rect class="frame" x="40" y="170" width="1210" height="662" rx="6" stroke-dasharray="3 4"/>
  <text class="mg xs" x="56" y="190">AWS region (var.aws_region, default us-east-1) · single AZ</text>

  <rect class="frame" x="70" y="228" width="810" height="584" rx="6"/>
  <text class="t h2" x="88" y="252">VPC 10.0.0.0/16</text>
  <text class="mg xs" x="88" y="270">default SG has no rules</text>

  <!-- IGW on VPC edge -->
  <rect class="box" x="440" y="208" width="190" height="40" rx="4"/>
  <text class="t h3" x="470" y="233">Internet Gateway</text>

  <!-- Public subnet -->
  <rect class="tier" x="100" y="290" width="750" height="206" rx="4"/>
  <text class="t h2" x="116" y="314">PUBLIC SUBNET 10.0.1.0/24</text>
  <text class="mg xs" x="116" y="332">0.0.0.0/0 → IGW</text>
  <rect class="badge" x="560" y="300" width="278" height="40" rx="3"/>
  <text class="bt" x="570" y="316">NACL in : 22←admin · 80/443←private</text>
  <text class="bt" x="570" y="332">NACL out: 22→private · 80/443 · return</text>

  <rect class="box" x="130" y="352" width="300" height="130" rx="4"/>
  <text class="t h3" x="148" y="378">Bastion host</text>
  <text class="m xs" x="148" y="400">EC2 t3.micro · Amazon Linux 2023</text>
  <text class="m xs" x="148" y="418">public IP · key-only SSH</text>
  <text class="m xs" x="148" y="440">SG bastion-sg</text>
  <text class="m xs" x="148" y="456">  in: tcp/22 ← admin_cidrs</text>
  <text class="m xs" x="148" y="474">IMDSv2 · encrypted gp3</text>

  <rect class="box" x="560" y="352" width="270" height="96" rx="4"/>
  <text class="t h3" x="578" y="378">NAT Gateway + EIP</text>
  <text class="m xs" x="578" y="400">outbound-only path for</text>
  <text class="m xs" x="578" y="418">the private subnet;</text>
  <text class="m xs" x="578" y="436">no inbound connections</text>

  <!-- Private subnet -->
  <rect class="tierp" x="100" y="560" width="750" height="230" rx="4"/>
  <text class="t h2" x="230" y="584">PRIVATE SUBNET 10.0.2.0/24</text>
  <text class="mg xs" x="230" y="602">0.0.0.0/0 → NAT · no IGW route</text>
  <rect class="badge" x="560" y="570" width="278" height="40" rx="3"/>
  <text class="bt" x="570" y="586">NACL in : 22/80 ← public subnet</text>
  <text class="bt" x="570" y="602">NACL out: 80/443 · return → public</text>

  <rect class="box" x="130" y="630" width="300" height="146" rx="4"/>
  <text class="t h3" x="148" y="656">Web server (httpd)</text>
  <text class="m xs" x="148" y="678">EC2 t3.micro · Amazon Linux 2023</text>
  <text class="m xs" x="148" y="696">NO public IP</text>
  <text class="m xs" x="148" y="718">SG web-sg</text>
  <text class="m xs" x="148" y="734">  in : tcp/22, tcp/80 ← bastion-sg</text>
  <text class="m xs" x="148" y="750">  out: tcp/80, tcp/443</text>
  <text class="m xs" x="148" y="768">IMDSv2 · encrypted gp3</text>

  <!-- Logging column -->
  <text class="t h2" x="925" y="252">LOGGING / MONITORING</text>

  <rect class="box" x="925" y="290" width="290" height="92" rx="4"/>
  <text class="t h3" x="943" y="316">VPC Flow Logs</text>
  <text class="m xs" x="943" y="338">scope: whole VPC · traffic: ALL</text>
  <text class="m xs" x="943" y="356">60 s aggregation</text>
  <text class="m xs" x="943" y="372">IAM role → 1 log group only</text>

  <rect class="box" x="925" y="430" width="290" height="150" rx="4"/>
  <text class="t h3" x="943" y="456">CloudWatch Logs</text>
  <text class="m xs" x="943" y="478">/securevpc-lab/vpc-flow-logs</text>
  <text class="m xs" x="943" y="496">KMS CMK · key rotation on</text>
  <text class="m xs" x="943" y="514">retention 14 days</text>
  <text class="m xs" x="943" y="536">metric RejectedFlows</text>
  <text class="m xs" x="943" y="554">3 saved Logs Insights queries</text>
  <text class="m xs" x="943" y="570">(rejects · SSH · egress)</text>

  <rect class="dash" x="925" y="630" width="290" height="120" rx="4"/>
  <text class="t h3" x="943" y="656">S3 archive (optional, off)</text>
  <text class="m xs" x="943" y="678">enable_s3_flow_log_archive</text>
  <text class="m xs" x="943" y="696">Parquet · hourly partitions</text>
  <text class="m xs" x="943" y="714">SSE-KMS · TLS-only policy</text>
  <text class="m xs" x="943" y="732">public access blocked · expiry</text>

  <!-- 1: admin SSH path -->
  <path class="in" d="M225,134 L225,158 L480,158 L480,206" marker-end="url(#arrow)"/>
  <path class="in" d="M495,248 L495,410 L433,410" marker-end="url(#arrow)"/>
  <circle class="num" cx="225" cy="158" r="11"/><text class="numt" x="221" y="162">1</text>
  <text class="m xs" x="248" y="151">SSH :22 from admin_cidrs only</text>

  <!-- 2: bastion -> web -->
  <path class="in" d="M180,482 L180,628" marker-end="url(#arrow)"/>
  <circle class="num" cx="180" cy="528" r="11"/><text class="numt" x="176" y="532">2</text>
  <text class="m xs" x="200" y="524">SSH :22 (jump via -W) · HTTP :80</text>
  <text class="m xs" x="200" y="540">source = bastion-sg (SG reference)</text>

  <!-- 3: web egress via NAT -->
  <path class="out" d="M430,700 L500,700 L500,530 L640,530 L640,451" marker-end="url(#arrow)"/>
  <path class="out" d="M830,400 L864,400 L864,276 L600,276 L600,251" marker-end="url(#arrow)"/>
  <path class="out" d="M600,208 L600,190 L705,190 L705,137" marker-end="url(#arrow)"/>
  <circle class="num" cx="500" cy="650" r="11"/><text class="numt" x="496" y="654">3</text>
  <text class="m xs" x="518" y="646">egress 80/443 only</text>
  <text class="m xs" x="518" y="662">(dnf install httpd)</text>

  <!-- 4: flow logs -->
  <path class="log" d="M880,336 L922,336" marker-end="url(#arrow-grey)"/>
  <path class="log" d="M1070,382 L1070,427" marker-end="url(#arrow-grey)"/>
  <path class="log" d="M1215,336 L1234,336 L1234,690 L1218,690" marker-end="url(#arrow-grey)"/>
  <circle class="num" cx="901" cy="318" r="11"/><text class="numt" x="897" y="322">4</text>

  <!-- Legend -->
  <line class="in" x1="60" y1="864" x2="110" y2="864"/>
  <text class="m xs" x="120" y="868">admin path (stateful SG + stateless NACL)</text>
  <line class="out" x1="480" y1="864" x2="530" y2="864"/>
  <text class="m xs" x="540" y="868">outbound-only egress via NAT</text>
  <line class="log" x1="790" y1="864" x2="840" y2="864"/>
  <text class="m xs" x="850" y="868">flow log delivery</text>
  <rect class="dash" x="1020" y="855" width="26" height="18" rx="2"/>
  <text class="m xs" x="1054" y="868">optional</text>
</svg>
